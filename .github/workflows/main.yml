name: Executar Bot Secundario

on:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:
    inputs:
      url_jogo:
        description: 'Cole a URL do jogo aqui'
        required: false
        default: ''

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests playwright-stealth

      - name: Instalar navegadores do Playwright
        run: npx playwright install chromium --with-deps

      - name: Executar Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_GROUP_ID: ${{ secrets.GREEN_API_GROUP_ID }}
        run: python bot.py "${{ github.event.inputs.url_jogo }}"

      - name: Salvar alteracoes na lista de jogos
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add jogos.txt
          git commit -m "Atualizando jogos.txt [skip ci]" || exit 0
          git push
